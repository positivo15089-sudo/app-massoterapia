name: Compilar APK Android Automaticamente

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar Instalador APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar codigo do projeto
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Gradle 8.7 na nuvem
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 4. Compilar Aplicativo Android (APK Debug instalavel)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 5. Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Aplicativo-Massoterapia-Depilacao-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
